<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css" />
    <meta name="google-site-verification" content="2BozHl1vDbqjl36JsbahRn3LnxMsS4bckF9BG74aWYU" />
</head>
<body>
    <h1 class="heading">Rock Paper Scissors</h1>

    <div class="choices">
        <button class="choice" id="rock">
            <img src="./images/rock.png" alt="Rock"/>
        </button>
        <button class="choice" id="paper">
            <img src="./images/paper.png" alt="Paper"/>
        </button>
        <button class="choice" id="scissors">
            <img src="./images/scissors.png" alt="Scissors"/>
        </button>
    </div>

    <div class="score-board">
        <div class="score">
            <p id="user-score">0</p>
            <p>You</p>
        </div>
        <div class="score">
            <p id="comp-score">0</p>
            <p>Computer</p>
        </div>
    </div>

    <div class="msg-container">
        <p id="msg">Play your move</p>
    </div>
    <script src="app.js"></script>
</body>
</html>
